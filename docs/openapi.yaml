  /admin/donations:
    post:
      operationId: donationsCreate
      tags:
      - 'Admin: stock and donations'
      summary: Record a donation received
      description: |-
        Any admin (staff or super admin): `Authorization: Bearer <access token>`.

        `type: "Monetary"` needs `amount` (rands); `type: "Goods"` needs `stockItemId` and `quantity`, and adds that quantity to stock. `initiativeId`, `receiptReference`, `isAnonymous` and `dateReceived` (default today, never in the future) are optional.
      security:
      - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [Monetary, Goods]
                donorName: {type: string, minLength: 2, maxLength: 150}
                isAnonymous: {default: false, type: boolean}
                initiativeId: {type: integer, exclusiveMinimum: 0, maximum: 2147483647}
                amount:
                  anyOf:
                  - {type: string}
                  - {type: number}
                receiptReference: {type: string, minLength: 1, maxLength: 50}
                stockItemId: {type: integer, exclusiveMinimum: 0, maximum: 2147483647}
                quantity: {type: integer, minimum: 1, maximum: 100000}
                dateReceived: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
              required: [type, donorName, amount]
            example:
              type: Monetary
              donorName: Thabo Nkosi
              amount: '1250.50'
              receiptReference: EFT-20261016-01
              initiativeId: 5
              dateReceived: '2026-10-16'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    properties:
                      donationId: {type: integer}
                      type: {type: string}
                      donorName: {type: string}
                      isAnonymous: {type: boolean}
                      amountCents: {type: integer}
                      amount: {type: string}
                      receiptReference: {type: string}
                      stockItem: {description: Can be null.}
                      quantity: {description: Can be null.}
                      initiative:
                        type: object
                        properties:
                          initiativeId: {type: integer}
                          title: {type: string}
                      pledge: {description: Can be null.}
                      dateReceived: {type: string, format: date}
                      recordedBy:
                        type: object
                        properties:
                          adminId: {type: integer}
                          fullName: {type: string}
                      voided: {description: Can be null.}
              example:
                success: true
                data:
                  donationId: 1
                  type: Monetary
                  donorName: Thabo Nkosi
                  isAnonymous: false
                  amountCents: 125050
                  amount: R1 250.50
                  receiptReference: EFT-20261016-01
                  stockItem: null
                  quantity: null
                  initiative: {initiativeId: 5, title: Winter blanket drive}
                  pledge: null
                  dateReceived: '2026-10-16'
                  recordedBy: {adminId: 1, fullName: Lindiwe Dube}
                  voided: null
        '400':
          description: 'The request was refused: a field is missing or wrong. `fields` lists one message
            per field, to show under each input (`request` means the request as a whole).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                wrongFields:
                  summary: Wrong or missing fields
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Please check the highlighted fields.
                      fields:
                      - {field: type, message: Please choose Monetary or Goods.}
                      requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
