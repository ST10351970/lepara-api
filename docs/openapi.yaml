        Checked and priced again inside one transaction, with the sizes locked, so stock can't be oversold. EFT orders start as Pending payment, with the order number as the bank reference; cash on delivery starts as Confirmed. A line that can't be ordered gets 409 naming the item and how many are left. At most 3 unpaid orders open per customer.
      security:
      - customerBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        description: 'A new UUID for each order. Send the same key again when retrying, and the first
          order is returned (with the header `Idempotent-Replayed: true`) instead of a second one being
          placed.'
        required: true
        schema: {type: string, format: uuid}
        example: 3f2b8c1e-9d4a-4e6b-8f1a-2c3d4e5f6a7b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  minItems: 1
                  maxItems: 20
                  type: array
                  items:
                    type: object
                    properties:
                      variantId: {type: integer, exclusiveMinimum: 0, maximum: 2147483647}
                      quantity: {type: integer, minimum: 1, maximum: 10}
                    required: [variantId, quantity]
                recipientName: {type: string, minLength: 2, maxLength: 120, pattern: '^\p{L}[\p{L}\p{M}''
                    ’-]*$'}
                streetAddress: {type: string, minLength: 3, maxLength: 120}
                city: {type: string, minLength: 2, maxLength: 60}
                postalCode: {type: string, pattern: '^\d{4}$'}
                phone: {type: string}
                paymentMethod:
                  type: string
                  enum: [EFT, Cash on delivery]
                acceptTerms: {type: boolean, const: true}
              required: [items, recipientName, streetAddress, city, postalCode, phone, paymentMethod,
                acceptTerms]
            example:
              items:
              - {variantId: 14, quantity: 2}
              recipientName: Naledi Mokoena
              streetAddress: 18 Mofolo Street
              city: Soweto
              postalCode: '1801'
              phone: 071 234 5678
              paymentMethod: EFT
              acceptTerms: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    properties:
                      orderNumber: {type: string}
                      status: {type: string}
                      statusLabel: {type: string}
                      statusMessage: {type: string}
                      paymentMethod: {type: string}
                      paymentMethodLabel: {type: string}
                      paymentStatus: {type: string}
                      canCancel: {type: boolean}
                      placedAt: {type: string, format: date-time}
                      updatedAt: {type: string, format: date-time}
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            variantId: {type: integer}
                            productId: {type: integer}
                            name: {type: string}
                            size: {type: string}
                            quantity: {type: integer}
                            unitPriceCents: {type: integer}
                            unitPrice: {type: string}
                            lineTotalCents: {type: integer}
                            lineTotal: {type: string}
                            imageUrl: {description: Can be null.}
                      itemCount: {type: integer}
                      subtotalCents: {type: integer}
                      subtotal: {type: string}
                      deliveryFeeCents: {type: integer}
                      deliveryFee: {type: string}
                      totalCents: {type: integer}
                      total: {type: string}
                      deliveryAddress:
                        type: object
                        properties:
                          recipientName: {type: string}
                          streetAddress: {type: string}
                          city: {type: string}
                          postalCode: {type: string}
                          phone: {type: string}
                      courierReference: {description: Can be null.}
                      cancelReason: {description: Can be null.}
                      paymentInstructions:
                        type: object
                        properties:
                          reference: {type: string}
                          amountCents: {type: integer}
                          amount: {type: string}
                          bank:
                            type: object
                            properties:
                              bankName: {type: string}
                              accountName: {type: string}
                              accountNumber: {type: string}
                              branchCode: {type: string}
                      tracking:
                        type: array
                        items:
                          type: object
                          properties:
                            title: {type: string}
                            status: {type: string}
                            done: {type: boolean}
                            at: {description: Can be null.}
                      history:
                        type: array
                        items:
                          type: object
                          properties:
                            status: {type: string}
                            label: {type: string}
                            at: {type: string, format: date-time}
                            note: {description: Can be null.}
              example:
                success: true
                data:
                  orderNumber: LAFM-1001
                  status: Pending payment
                  statusLabel: Waiting for payment
                  statusMessage: Please pay R900 by EFT with LAFM-1001 as the reference. We'll confirm
                    your order when the payment arrives.
                  paymentMethod: EFT
