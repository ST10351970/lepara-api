  /auth/register:
    post:
      operationId: custRegister
      tags: [Customer accounts]
      summary: Create a shop account
      description: A 6-digit code is emailed. An email that already has an account gets exactly the same
        reply (the email itself tells the owner to sign in instead), so nobody can find out who has an
        account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: {type: string, minLength: 2, maxLength: 60, pattern: '^\p{L}[\p{L}\p{M}'' ’-]*$'}
                lastName: {type: string, minLength: 2, maxLength: 60, pattern: '^\p{L}[\p{L}\p{M}'' ’-]*$'}
