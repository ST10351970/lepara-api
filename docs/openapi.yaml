                    recipientName: Naledi Mokoena
                    streetAddress: 18 Mofolo Street
                    city: Soweto
                    postalCode: '1801'
                    phone: '+27712345678'
                  courierReference: null
                  cancelReason: null
                  paymentInstructions:
                    reference: LAFM-1001
                    amountCents: 90000
