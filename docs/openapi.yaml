  /admin/auth/refresh:
    post:
      operationId: adminRefresh
      tags: ['Admin: sign-in']
      summary: Get a new access token with the refresh cookie
      description: |-
        No Authorization header: the browser sends the `lepara_admin_refresh` cookie set at sign-in (httpOnly, sent only to /api/v1/admin/auth).

        Call with `credentials: "include"` so the browser sends the cookie. The cookie is replaced on every refresh; using an old one again ends every session of that admin.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    properties:
                      accessToken: {type: string}
                      tokenType: {type: string}
                      expiresIn: {type: integer}
                      admin:
                        type: object
                        properties:
                          adminId: {type: integer}
                          username: {type: string}
                          fullName: {type: string}
                          email: {type: string}
                          role: {type: string}
                          twoFactorEnabled: {type: boolean}
                          mustChangePassword: {type: boolean}
                          lastLoginAt: {type: string, format: date-time}
                          backupCodesRemaining: {type: integer}
              example:
                success: true
                data:
                  accessToken: <access token (JWT)>
                  tokenType: Bearer
                  expiresIn: 900
                  admin:
                    adminId: 1
                    username: lindiwe
                    fullName: Lindiwe Dube
                    email: lindiwe@example.com
                    role: super_admin
                    twoFactorEnabled: true
                    mustChangePassword: false
                    lastLoginAt: '2026-10-16T15:14:03.734Z'
                    backupCodesRemaining: 10
        '401': {$ref: '#/components/responses/Unauthorized'}
