    post:
      operationId: devicesRegister
      tags: [Push notifications]
      summary: Register this phone for push notifications
      description: |-
        Works signed in or not. Signed in, the device is linked to the account.

        Call on every app start (after asking for permission) and after signing in or out. `token` is the native token from expo-notifications' `getDevicePushTokenAsync()`, not an Expo push token. Signed in (with the Authorization header), the phone also gets that customer's order updates; without it, news only.
      security:
      - customerBearer: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: {type: string}
                platform:
                  type: string
                  enum: [android, ios]
              required: [token, platform]
            example:
              token: dQw4w9WgXcQ:APA91bHun4MxP5egoKMwt2KZFBaFUH-1RYqx
              platform: android
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    properties:
                      registered: {type: boolean}
                      linkedToAccount: {type: boolean}
              example:
                success: true
                data: {registered: true, linkedToAccount: true}
        '400':
          description: 'The request was refused: a field is missing or wrong. `fields` lists one message
            per field, to show under each input (`request` means the request as a whole).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                wrongFields:
                  summary: Wrong or missing fields
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Please check the highlighted fields.
                      fields:
                      - field: token
                        message: Please send the native device token from getDevicePushTokenAsync(), not
                          an Expo push token.
                      requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
        '401': {$ref: '#/components/responses/Unauthorized'}
