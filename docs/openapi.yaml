                  placedAt: '2026-10-16T15:14:04.547Z'
                  updatedAt: '2026-10-16T15:14:04.547Z'
                  items:
                  - variantId: 14
                    productId: 4
                    name: Fleece jacket
                    size: M
                    quantity: 2
                    unitPriceCents: 42000
                    unitPrice: R420
                    lineTotalCents: 84000
                    lineTotal: R840
                    imageUrl: null
                  itemCount: 2
                  subtotalCents: 84000
                  subtotal: R840
                  deliveryFeeCents: 6000
                  deliveryFee: R60
                  totalCents: 90000
                  total: R900
