# The Lepara Ale fele Moya API, in OpenAPI 3.1. Shown at /api/docs (Swagger UI).
# Every example reply was produced by the API itself against a test database.
openapi: 3.1.0
info:
  title: Lepara Ale fele Moya API
  version: 1.0.0
  description: |
    The back-end API for the **Lepara Ale fele Moya** mobile app (Expo) and website.
    Every example reply on this page was produced by the API itself, by running the example request
    against a test database.

    ## Basics

    * **Base URL:** `/api/v1` on the server, for example `https://<your-render-service>.onrender.com/api/v1`.
      Locally: `http://localhost:3000/api/v1`.
    * **JSON in, JSON out.** Send `Content-Type: application/json`. Unknown fields are ignored.
    * **Every reply has the same envelope.** Success: `{ "success": true, "data": ..., "meta"?: ... }`.
      Failure: `{ "success": false, "error": { "code", "message", "fields"?, "requestId" } }`.
      `message` is plain language, ready to show; `fields` has one message per form field.
    * **Lists** take `?page=` (from 1) and `?pageSize=` (default 20, at most 50) and reply with
      `meta: { page, pageSize, total, totalPages }`.
    * **Money** comes as cents plus a label: `"priceCents": 45000, "price": "R450"`. Send amounts in
      rands (`"450"` or `"450.00"`).
    * **Dates** are `YYYY-MM-DD` and times `HH:MM`, both in South African time (Africa/Johannesburg).
      Timestamps are ISO 8601 in UTC (`2026-10-16T12:00:00.000Z`).
    * **Every reply has an `X-Request-Id` header.** Quote it (or `error.requestId`) when reporting a problem.

    ## Signing in

    **Customers (the app's shop):** register, then confirm the email with the 6-digit code, which signs
    them in. The reply has an `accessToken` (15 minutes) and a `refreshToken` (7 days, replaced on
    every use). Send `Authorization: Bearer <accessToken>`; when a request gets `TOKEN_EXPIRED`,
    call POST /auth/refresh with the refresh token and retry. The app keeps the refresh token in
    expo-secure-store. On the website the refresh token is an httpOnly cookie instead.

    **Admins (the website's dashboard only):** POST /admin/auth/login with username and password, then a
    6-digit code from an authenticator app (the first time, the app is set up with a QR code). The
    access token lasts 15 minutes; the refresh token is an httpOnly cookie (12 hours), so the website
    calls the API with `credentials: "include"`. There are two roles: **staff** and **super admin**
    (only super admins manage admin accounts).

    ## Limits

    | What | Limit (per IP address) |
    | --- | --- |
    | Every request (except /health) | 900 per 15 minutes |
    | Admin and customer sign-in | 10 per 15 minutes |
    | Entering or requesting codes | 10 per 15 minutes |
    | Public forms | 5 per 10 minutes |
    | Tracking (wrong attempts only) | 5 per 15 minutes |

    A refused request gets 429 with `RateLimit` and `Retry-After` headers. JSON bodies are limited to
    100 kB and photos to 2 MB.

    ## Trying requests on this page

    Open a request, click **Try it out**, fill in the example and click **Execute**. Requests go to the
    server this page is on, and change its real data.

    1. **As an admin:** run POST /admin/auth/login, then POST /admin/auth/2fa/verify with the
       `pendingToken` and the 6-digit code from your authenticator app (the first time:
       /2fa/setup, scan the QR code, then /2fa/confirm). Copy `accessToken`, click **Authorize** at the
       top and paste it under **adminBearer**.
    2. **As a customer:** run POST /auth/login, copy `accessToken`, and paste it under **customerBearer**.
       On this page the refresh token is kept in a cookie, as on the website, so it is not in the reply.

    Access tokens last 15 minutes: when a request gets `TOKEN_EXPIRED`, run the matching
    "Get a new access token" request and authorize again.

    ## Placing orders safely

    POST /orders needs an `Idempotency-Key` header: a new UUID for each order. If the network drops
    and the app sends the same order again with the same key, the first order comes back (with
    `Idempotent-Replayed: true`) instead of a second one being placed.
  license: {name: MIT, identifier: MIT}
servers:
- {url: /api/v1, description: This server}
- {url: 'http://localhost:3000/api/v1', description: Running on your computer}
tags:
- {name: Health, description: 'Is the API up?'}
- name: Events
  description: Published events (initiatives) for the app and website. No sign-in.
- {name: News, description: Announcements. No sign-in.}
- name: Forms
  description: 'The public forms: volunteer, give, ask for help, contact. No sign-in; each gets a reference
    number.'
- name: Tracking
  description: Track a form with its reference number. No sign-in.
- name: Shop
  description: Products for the Shop screen. No sign-in.
- name: Customer accounts
  description: 'Shop accounts: register, confirm the email, sign in, profile, password, delete.'
- {name: Cart and orders, description: Checkout and the customer's orders.}
- name: Push notifications
  description: Register phones for news and order updates (Firebase Cloud Messaging).
- name: 'Admin: sign-in'
  description: Admin sign-in with password plus an authenticator app (2FA). Website only.
- name: 'Admin: admins (super admins)'
  description: Managing admin accounts. Super admins only.
- name: 'Admin: events'
  description: Events, their kinds and their volunteer tasks.
- name: 'Admin: news'
  description: Announcements. Publishing one also sends a push notification.
- name: 'Admin: reviews'
  description: Reviewing volunteer applications, assistance requests, donation pledges and enquiries.
- name: 'Admin: stock and donations'
  description: Donated goods in stock, giving them out, and recording donations.
- name: 'Admin: shop products'
  description: Shop categories, products, sizes and stock.
- name: 'Admin: orders'
  description: Payments, packing, shipping and cancelling.
- name: 'Admin: dashboard and reports'
  description: The dashboard tiles and the reports, as JSON or CSV.
paths:
  /health:
    get:
      operationId: health
      tags: [Health]
      summary: Check that the API and its database are up
      description: Used by the host (Render) as its health check. Answers 503 when the database cannot
        be reached.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    properties:
                      status: {type: string}
                      database: {type: string}
                      uptimeSeconds: {type: integer}
                      time: {type: string, format: date-time}
              example:
                success: true
                data: {status: ok, database: up, uptimeSeconds: 5321, time: '2026-10-16T12:00:00.000Z'}
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /initiative-types:
    get:
      operationId: typesPublic
      tags: [Events]
      summary: Kinds of events, for the filter chips
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        typeId: {type: integer}
                        name: {type: string}
                        description: {type: string}
              example:
                success: true
                data:
                - typeId: 1
                  name: Garment donations
                  description: Collecting and handing out clothing and blankets.
                - {typeId: 5, name: Motivational and community engagement, description: Motivational events
                    and community days.}
                - typeId: 2
                  name: Pad drives
                  description: Collecting and distributing sanitary products.
  /initiatives:
    get:
      operationId: eventsList
      tags: [Events]
      summary: Published events for the app and website
      security: []
      parameters:
      - name: phase
        in: query
        description: 'upcoming (not yet ended), completed, or all. For example: `upcoming`'
        required: false
        schema: {type: string}
      - name: typeId
        in: query
        description: 'Only this kind of event. For example: `3`'
        required: false
        schema: {type: integer, minimum: 1}
      - name: page
        in: query
        description: Page number, from 1
        required: false
        schema: {type: integer}
      - name: pageSize
        in: query
        description: Up to 50 (default 20)
        required: false
        schema: {type: integer}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        initiativeId: {type: integer}
                        title: {type: string}
                        typeId: {type: integer}
                        typeName: {type: string}
                        summary: {type: string}
                        description: {type: string}
                        location: {type: string}
                        startDate: {type: string, format: date}
                        endDate: {type: string, format: date}
                        startTime: {type: string}
                        endTime: {type: string}
                        dateLabel: {type: string}
                        timeLabel: {type: string}
                        phase: {type: string}
                        imageUrl: {description: Can be null.}
                        donationNeeds: {type: string}
                        volunteersRequired: {type: boolean}
                  meta: {$ref: '#/components/schemas/PageMeta'}
              example:
                success: true
                data:
                - initiativeId: 1
                  title: Community clothing drive
                  typeId: 1
                  typeName: Garment donations
                  summary: Donate clothing or volunteer to sort and prepare bundles.
                  description: Help sort clothing, prepare donation bundles and welcome neighbours. Bring
                    clean, wearable clothing and blankets, or contribute your time.
                  location: Orlando Community Hall, Soweto
                  startDate: '2026-10-24'
                  endDate: '2026-10-24'
                  startTime: '10:00'
                  endTime: '14:00'
                  dateLabel: 24 Oct 2026
                  timeLabel: 10:00–14:00 SAST
                  phase: Upcoming
                  imageUrl: null
                  donationNeeds: Clothing, blankets
                  volunteersRequired: true
                - initiativeId: 5
                  title: Winter blanket drive
                  typeId: 6
                  typeName: Blanket drives
                  summary: Help us hand out blankets in Soweto.
                  description: We are collecting and handing out warm blankets to families in Soweto ahead
                    of the coldest weeks.
                  location: Mofolo Community Hall, Soweto (back entrance)
                  startDate: '2026-10-26'
                  endDate: '2026-10-26'
                  startTime: 09:00
                  endTime: '14:00'
                  dateLabel: 26 Oct 2026
                  timeLabel: 09:00–14:00 SAST
                  phase: Upcoming
                  imageUrl: null
                  donationNeeds: Blankets, warm jackets
                  volunteersRequired: true
                meta: {page: 1, pageSize: 2, total: 4, totalPages: 2}
  /initiatives/{id}:
    get:
      operationId: eventsGet
      tags: [Events]
      summary: One published event
      security: []
      parameters:
      - name: id
        in: path
        description: The event's ID
        required: true
        schema: {type: integer, minimum: 1}
        example: 4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    properties:
                      initiativeId: {type: integer}
                      title: {type: string}
                      typeId: {type: integer}
                      typeName: {type: string}
                      summary: {type: string}
                      description: {type: string}
                      location: {type: string}
                      startDate: {type: string, format: date}
                      endDate: {type: string, format: date}
                      startTime: {type: string}
                      endTime: {type: string}
                      dateLabel: {type: string}
                      timeLabel: {type: string}
                      phase: {type: string}
                      imageUrl: {description: Can be null.}
                      donationNeeds: {type: string}
                      volunteersRequired: {type: boolean}
                      tasks:
                        type: array
                        items:
                          type: object
                          properties:
                            taskId: {type: integer}
                            name: {type: string}
                            volunteersNeeded:
                              type: [integer, 'null']
              example:
                success: true
                data:
                  initiativeId: 5
                  title: Winter blanket drive
                  typeId: 6
                  typeName: Blanket drives
                  summary: Help us hand out blankets in Soweto.
                  description: We are collecting and handing out warm blankets to families in Soweto ahead
                    of the coldest weeks.
                  location: Mofolo Community Hall, Soweto (back entrance)
                  startDate: '2026-10-26'
                  endDate: '2026-10-26'
                  startTime: 09:00
                  endTime: '14:00'
                  dateLabel: 26 Oct 2026
                  timeLabel: 09:00–14:00 SAST
                  phase: Upcoming
                  imageUrl: null
                  donationNeeds: Blankets, warm jackets
                  volunteersRequired: true
                  tasks:
                  - {taskId: 8, name: Sorting blankets, volunteersNeeded: 8}
                  - {taskId: 9, name: Serving soup, volunteersNeeded: null}
        '404': {$ref: '#/components/responses/NotFound'}
  /initiatives/{id}/tasks:
    get:
      operationId: eventsTasks
      tags: [Events]
      summary: An event's volunteer tasks, for the volunteer form
      security: []
      parameters:
      - name: id
        in: path
        description: The event's ID
        required: true
        schema: {type: integer, minimum: 1}
        example: 4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        taskId: {type: integer}
                        name: {type: string}
                        volunteersNeeded:
                          type: [integer, 'null']
              example:
                success: true
                data:
                - {taskId: 8, name: Sorting blankets, volunteersNeeded: 8}
                - {taskId: 9, name: Serving soup, volunteersNeeded: null}
        '404': {$ref: '#/components/responses/NotFound'}
  /announcements:
    get:
      operationId: newsList
      tags: [News]
      summary: Announcements, newest first
      security: []
      parameters:
      - name: page
        in: query
        description: Page number, from 1
        required: false
        schema: {type: integer}
      - name: pageSize
        in: query
        description: Up to 50 (default 20)
        required: false
        schema: {type: integer}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        announcementId: {type: integer}
                        title: {type: string}
                        body: {type: string}
                        publishedAt: {type: string, format: date-time}
                        dateLabel: {type: string}
                  meta: {$ref: '#/components/schemas/PageMeta'}
              example:
                success: true
                data:
                - announcementId: 1
                  title: Winter blanket drive this Saturday at 09:00
                  body: Join us at Mofolo Community Hall from 09:00 to hand out blankets to families in
                    need.
                  publishedAt: '2026-10-16T15:14:03.915Z'
                  dateLabel: 16 Oct 2026
                meta: {page: 1, pageSize: 1, total: 1, totalPages: 1}
  /form-options:
    get:
      operationId: formOptions
      tags: [Forms]
      summary: The choices for the forms' drop-downs
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    properties:
                      donationCategories:
                        type: array
                        items:
                          type: object
                          properties:
                            value: {type: string}
                            label: {type: string}
                      assistanceRequestTypes:
                        type: array
                        items:
                          type: object
                          properties:
                            value: {type: string}
                            label: {type: string}
                      enquiryTypes:
                        type: array
                        items:
                          type: object
                          properties:
                            value: {type: string}
                            label: {type: string}
              example:
                success: true
                data:
                  donationCategories:
                  - {value: Goods, label: 'Goods (clothing, blankets)'}
                  - {value: Monetary, label: Monetary donation}
                  - {value: School supplies, label: School supplies}
                  - {value: Food and essentials, label: Food and essentials}
                  assistanceRequestTypes:
                  - {value: Clothing, label: Clothing}
                  - {value: Blankets, label: Blankets}
                  - {value: Sanitary products, label: Sanitary pads and hygiene products}
                  - {value: Food, label: Food parcels}
                  - {value: School supplies, label: School supplies}
                  - {value: Other, label: Something else}
                  enquiryTypes:
                  - {value: Donor, label: I would like to donate}
                  - value: Partner
                    label: My organisation would like to partner with you
  /volunteer-applications:
    post:
      operationId: formVolunteer
      tags: [Forms]
      summary: Apply to volunteer at an event
      description: No sign-in. At most 5 forms per address per 10 minutes. The reply has the reference
        number, which is also emailed if an email address was given. A filled-in `website` field (a hidden
        spam trap) gets a pretend success and saves nothing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                initiativeId: {type: integer, exclusiveMinimum: 0, maximum: 2147483647}
                taskId: {type: integer, exclusiveMinimum: 0, maximum: 2147483647}
                fullName: {type: string, minLength: 2, maxLength: 100, pattern: '^\p{L}[\p{L}\p{M}'' ’-]*$'}
                phone: {type: string}
                email:
                  type: string
                  maxLength: 150
                  pattern: ^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[^\s@.]{2,}$
                contribution: {type: string, minLength: 10, maxLength: 1000}
                availability: {type: string, minLength: 3, maxLength: 200}
                consent: {type: boolean, const: true}
              required: [initiativeId, fullName, phone, contribution, availability, consent]
            example:
              initiativeId: 5
              taskId: 8
              fullName: Lerato Dlamini
              phone: 072 345 6789
              email: lerato@example.com
              contribution: I can help sort and pack blankets in the morning.
              availability: Saturday 09:00 to 13:00
              consent: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    properties:
                      referenceNumber: {type: string}
                      status: {type: string}
                      submittedAt: {type: string, format: date-time}
                      message: {type: string}
              example:
                success: true
                data:
                  referenceNumber: VOL-QGEJ3L
                  status: Submitted
                  submittedAt: '2026-10-16T15:14:03.962Z'
                  message: Thank you. Your application to help with Sorting blankets at Winter blanket
                    drive has been sent for review. Your reference number is VOL-QGEJ3L.
        '400':
          description: 'The request was refused: a field is missing or wrong. `fields` lists one message
            per field, to show under each input (`request` means the request as a whole).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                wrongFields:
                  summary: Wrong or missing fields
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Please check the highlighted fields.
                      fields:
                      - {field: initiativeId, message: Please choose an event.}
                      - {field: fullName, message: Please enter your full name.}
                      - {field: phone, message: Please enter your phone number.}
                      - field: contribution
                        message: Please describe how you would like to help.
                      - {field: availability, message: Please say when you are available.}
                      - field: consent
                        message: Please tick the box to agree before sending.
                      requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /donation-pledges:
    post:
      operationId: formPledge
      tags: [Forms]
      summary: Offer a donation (the Give form)
      description: 'No sign-in. At most 5 forms per address per 10 minutes. The reply has the reference
        number, which is also emailed if an email address was given. A filled-in `website` field (a hidden
        spam trap) gets a pretend success and saves nothing. No money is taken: the NGO contacts the donor.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: {type: string, minLength: 2, maxLength: 100, pattern: '^\p{L}[\p{L}\p{M}'' ’-]*$'}
                email:
                  type: string
                  maxLength: 150
                  pattern: ^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[^\s@.]{2,}$
                phone: {type: string}
                initiativeId: {type: integer, exclusiveMinimum: 0, maximum: 2147483647}
                category:
                  type: string
                  enum: [Goods, Monetary, School supplies, Food and essentials]
                description: {type: string, minLength: 10, maxLength: 1000}
                estimatedValue:
                  anyOf:
                  - {type: string}
                  - {type: number}
                consent: {type: boolean, const: true}
              required: [fullName, email, phone, category, description, consent]
            example:
              fullName: Thabo Nkosi
              email: thabo@example.com
              phone: 073 456 7890
              initiativeId: 5
              category: Goods
              description: Twenty new fleece blankets for the winter drive.
              estimatedValue: '2400'
              consent: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    properties:
                      referenceNumber: {type: string}
                      status: {type: string}
                      submittedAt: {type: string, format: date-time}
                      message: {type: string}
              example:
                success: true
                data:
                  referenceNumber: PLG-H2FV2P
                  status: Pending
                  submittedAt: '2026-10-16T15:14:03.967Z'
                  message: Thank you. Your donation pledge has been sent for review. Your reference number
                    is PLG-H2FV2P. No payment is collected through this form.
        '400':
          description: 'The request was refused: a field is missing or wrong. `fields` lists one message
            per field, to show under each input (`request` means the request as a whole).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                wrongFields:
                  summary: Wrong or missing fields
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Please check the highlighted fields.
                      fields:
                      - {field: fullName, message: Please enter your full name.}
                      - {field: email, message: Please enter your email address.}
                      - {field: phone, message: Please enter your phone number.}
                      - {field: category, message: Please choose one of the options.}
                      - {field: description, message: Please describe your donation.}
                      - field: consent
                        message: Please tick the box to agree before sending.
                      requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /assistance-requests:
    post:
      operationId: formRequest
      tags: [Forms]
      summary: Ask for help
      description: No sign-in. At most 5 forms per address per 10 minutes. The reply has the reference
        number, which is also emailed if an email address was given. A filled-in `website` field (a hidden
        spam trap) gets a pretend success and saves nothing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: {type: string, minLength: 2, maxLength: 100, pattern: '^\p{L}[\p{L}\p{M}'' ’-]*$'}
                phone: {type: string}
                email:
                  type: string
                  maxLength: 150
                  pattern: ^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[^\s@.]{2,}$
                requestType:
                  type: string
                  enum: [Clothing, Blankets, Sanitary products, Food, School supplies, Other]
                description: {type: string, minLength: 10, maxLength: 1000}
                consent: {type: boolean, const: true}
              required: [fullName, phone, requestType, description, consent]
            example:
              fullName: Naledi Mokoena
              phone: 071 234 5678
              email: naledi@example.com
              requestType: Blankets
              description: We are a family of five and need warm blankets for winter.
              consent: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    properties:
                      referenceNumber: {type: string}
                      status: {type: string}
                      submittedAt: {type: string, format: date-time}
                      message: {type: string}
              example:
                success: true
                data:
                  referenceNumber: REQ-B4MGAZ
                  status: Submitted
                  submittedAt: '2026-10-16T15:14:03.972Z'
                  message: Thank you. Your request has been received. Your reference number is REQ-B4MGAZ.
                    Our team will contact you.
        '400':
