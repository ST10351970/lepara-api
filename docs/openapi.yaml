    patch:
      operationId: adminOrderStatus
      tags: ['Admin: orders']
      summary: Pack, ship, deliver or cancel
      description: |-
        Any admin (staff or super admin): `Authorization: Bearer <access token>`.

        One step at a time: Confirmed → Packed → Shipped (needs `courierReference`) → Delivered; skipping or going back gets 409. Cancelling needs a `reason` (sent to the customer) and is allowed until shipped; a paid order also needs `refunded: true`. The stock goes back on cancelling.
      security:
      - adminBearer: []
      parameters:
      - name: id
        in: path
        description: The order's ID
        required: true
        schema: {type: integer, minimum: 1}
        example: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Pending payment, Confirmed, Packed, Shipped, Delivered, Cancelled]
                courierReference: {type: string, minLength: 3, maxLength: 60, pattern: '^[\p{L}\p{N}][\p{L}\p{N}
                    .#:/-]*$'}
                reason: {type: string, minLength: 3, maxLength: 500}
                refunded: {type: boolean}
              required: [status, courierReference]
            example: {status: Shipped, courierReference: TCG123456789}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
