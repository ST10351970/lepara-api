                  type: string
                  maxLength: 254
                  pattern: ^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[^\s@.]{2,}$
                mobile: {type: string}
                password:
                  type: string
                  minLength: 8
                  maxLength: 64
                  allOf:
                  - {pattern: '[A-Za-z]'}
                  - {pattern: \d}
                confirmPassword: {type: string}
                acceptTerms: {type: boolean, const: true}
              required: [firstName, lastName, email, mobile, password, confirmPassword, acceptTerms]
            example:
              firstName: Naledi
              lastName: Mokoena
              email: naledi@example.com
              mobile: 071 234 5678
              password: Winter-Blankets-2026
              confirmPassword: Winter-Blankets-2026
              acceptTerms: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    properties:
                      email: {type: string}
                      message: {type: string}
              example:
                success: true
                data: {email: naledi@example.com, message: Check your email for a 6-digit code.}
        '400':
          description: 'The request was refused: a field is missing or wrong. `fields` lists one message
            per field, to show under each input (`request` means the request as a whole).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                wrongFields:
                  summary: Wrong or missing fields
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Please check the highlighted fields.
                      fields:
                      - field: email
                        message: Please enter a valid email, for example name@example.com.
                      - {field: mobile, message: Please enter your phone number.}
                      - field: password
                        message: Your password needs at least 8 characters.
                      - field: acceptTerms
                        message: Please accept the terms and privacy policy to create an account.
                      requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
