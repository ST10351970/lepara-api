                    note: null}
          headers:
            Idempotent-Replayed:
              description: '`true` when this is the stored reply to an earlier request with the same Idempotency-Key.'
              schema:
                type: string
                enum: ['true']
        '400':
          description: 'The request was refused: a field is missing or wrong. `fields` lists one message
            per field, to show under each input (`request` means the request as a whole).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                wrongFields:
