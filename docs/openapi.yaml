        Add `format=csv` to download it as a spreadsheet. A range with nothing in it gives zeros; `from` after `to` gets 400. Cancelled orders are counted but not added to the sales. The CSV lists each order.
      security:
      - adminBearer: []
      parameters:
      - name: from
        in: query
        description: 'First day (YYYY-MM-DD, Johannesburg); default the 1st of this month. For example:
          `2026-10-01`'
        required: false
        schema: {type: string, format: date}
      - name: to
        in: query
        description: 'Last day; default today. For example: `2026-10-31`'
        required: false
        schema: {type: string, format: date}
      - name: format
        in: query
        description: 'json (default) or csv to download. For example: `json`'
        required: false
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    properties:
                      range:
                        type: object
                        properties:
                          from: {type: string, format: date}
                          to: {type: string, format: date}
                          format: {type: string}
                      summary:
                        type: object
                        properties:
                          orderCount: {type: integer}
                          cancelledCount: {type: integer}
                          activeOrderCount: {type: integer}
                          itemsSold: {type: integer}
                          salesTotal:
                            type: object
                            properties:
                              cents: {type: integer}
                              label: {type: string}
                          goodsTotal:
                            type: object
                            properties:
                              cents: {type: integer}
                              label: {type: string}
                          deliveryTotal:
                            type: object
                            properties:
                              cents: {type: integer}
                              label: {type: string}
                          paidTotal:
                            type: object
                            properties:
                              cents: {type: integer}
                              label: {type: string}
                          unpaidTotal:
                            type: object
                            properties:
                              cents: {type: integer}
                              label: {type: string}
                          refundedTotal:
                            type: object
                            properties:
                              cents: {type: integer}
                              label: {type: string}
                          averageOrder:
                            type: object
                            properties:
                              cents: {type: integer}
                              label: {type: string}
                      byStatus:
                        type: object
                        properties:
                          Pending payment: {type: integer}
                          Confirmed: {type: integer}
                          Packed: {type: integer}
                          Shipped: {type: integer}
                          Delivered: {type: integer}
                          Cancelled: {type: integer}
                      byPaymentMethod:
                        type: array
                        items:
                          type: object
                          properties:
                            paymentMethod: {type: string}
                            label: {type: string}
                            orderCount: {type: integer}
                            total:
                              type: object
                              properties:
                                cents: {type: integer}
                                label: {type: string}
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            productName: {type: string}
                            size: {type: string}
                            unitsSold: {type: integer}
                            sales:
                              type: object
                              properties:
                                cents: {type: integer}
                                label: {type: string}
              example:
                success: true
                data:
                  range: {from: '2026-10-01', to: '2026-10-16', format: json}
                  summary:
                    orderCount: 2
                    cancelledCount: 1
                    activeOrderCount: 1
                    itemsSold: 2
                    salesTotal: {cents: 90000, label: R900.00}
                    goodsTotal: {cents: 84000, label: R840.00}
                    deliveryTotal: {cents: 6000, label: R60.00}
                    paidTotal: {cents: 90000, label: R900.00}
                    unpaidTotal: {cents: 0, label: R0.00}
                    refundedTotal: {cents: 0, label: R0.00}
                    averageOrder: {cents: 90000, label: R900.00}
                  byStatus:
                    Pending payment: 0
                    Confirmed: 0
                    Packed: 0
                    Shipped: 1
                    Delivered: 0
                    Cancelled: 1
                  byPaymentMethod:
                  - paymentMethod: EFT
                    label: EFT bank transfer
                    orderCount: 1
                    total: {cents: 90000, label: R900.00}
                  products:
                  - productName: Fleece jacket
                    size: M
                    unitsSold: 2
                    sales: {cents: 84000, label: R840.00}
            text/csv:
              schema: {type: string}
              example: 'With ?format=csv: a spreadsheet download (UTF-8 with BOM, Windows line endings).'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The admin `accessToken` from /admin/auth/2fa/verify (or /2fa/confirm, /refresh).
    customerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The customer `accessToken` from /auth/verify-email, /auth/login or /auth/refresh.
  schemas:
    Error:
      type: object
      required: [success, error]
      properties:
        success: {const: false}
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
              - VALIDATION_ERROR
              - INVALID_JSON
              - UNAUTHORIZED
              - TOKEN_EXPIRED
              - FORBIDDEN
              - PASSWORD_CHANGE_REQUIRED
              - NOT_FOUND
              - CONFLICT
              - PAYLOAD_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - ACCOUNT_LOCKED
              - EMAIL_NOT_VERIFIED
              - IDEMPOTENCY_KEY_REUSED
              - RATE_LIMITED
              - INTERNAL_ERROR
              - SERVICE_UNAVAILABLE
              description: A fixed code for the app to act on (for example TOKEN_EXPIRED → refresh and
                retry).
            message:
              type: string
              description: A plain-language message, ready to show to the person.
            fields:
              type: array
              description: One message per form field, when fields are wrong.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    examples: [email, items.0.quantity]
                  message: {type: string}
            requestId:
              type: string
              description: 'Quote this when reporting a problem: it finds the request in the server logs.'
    PageMeta:
      type: object
      properties:
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer}
        totalPages: {type: integer}
  responses:
    BadRequest:
      description: 'The request was refused: a field is missing or wrong. `fields` lists one message per
        field, to show under each input (`request` means the request as a whole).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            validation:
              summary: A field is wrong
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: Please check the highlighted fields.
                  fields:
                  - field: email
                    message: Please enter a valid email, for example name@example.com.
                  requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
            invalidJson:
              summary: The body is not valid JSON
              value:
                success: false
                error:
                  code: INVALID_JSON
                  message: We couldn't read that request. Please try again.
                  requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
    Unauthorized:
      description: 'Not signed in, or the token is wrong. `TOKEN_EXPIRED` means the access token is out
        of date: refresh it (POST /auth/refresh or /admin/auth/refresh) and send the request again.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            unauthorized:
              summary: No token, or a wrong one
              value:
                success: false
                error: {code: UNAUTHORIZED, message: Please sign in to continue., requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b}
            expired:
              summary: The access token expired
              value:
                success: false
                error:
                  code: TOKEN_EXPIRED
                  message: Your session has expired. Please sign in again.
                  requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
    Forbidden:
      description: Signed in, but not allowed. An admin with a temporary password gets `PASSWORD_CHANGE_REQUIRED`
        until they change it (PATCH /admin/me/password).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            forbidden:
              summary: Not allowed
              value:
                success: false
                error: {code: FORBIDDEN, message: You do not have permission to do that., requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b}
            passwordChange:
              summary: Temporary password not changed yet
              value:
                success: false
                error:
                  code: PASSWORD_CHANGE_REQUIRED
                  message: Please change your temporary password before continuing.
                  requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
    NotFound:
      description: Nothing with that ID or number (or not visible to you).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            notFound:
              summary: Not found
              value:
                success: false
                error: {code: NOT_FOUND, message: We couldn't find that item., requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b}
    Conflict:
      description: 'The request is valid but clashes with the current state: a duplicate, a step out of
        order, or not enough stock. The message says what to do.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            conflict:
              summary: A clash with the current state
              value:
                success: false
                error: {code: CONFLICT, message: This has already been submitted., requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b}
    PayloadTooLarge:
      description: The photo or request is too large.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            tooLarge:
              summary: Photo over 2 MB
              value:
                success: false
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: That photo is too large. Please choose one under 2 MB.
                  requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
    UnsupportedMediaType:
      description: The file is not a JPEG, PNG or WebP photo (checked from its contents).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            notAPhoto:
              summary: Not a photo
              value:
                success: false
                error: {code: UNSUPPORTED_MEDIA_TYPE, message: 'Please upload a JPEG, PNG or WebP photo.',
                  requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b}
    Unprocessable:
      description: The same Idempotency-Key came with a different order. Make a new key for a new order.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            keyReused:
              summary: Key reused for a different order
              value:
                success: false
                error:
                  code: IDEMPOTENCY_KEY_REUSED
                  message: This Idempotency-Key was already used for a different order. Send a new key
                    for a new order.
                  requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
    Locked:
      description: 'Too many wrong passwords or codes: the account is locked for 15 minutes.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            locked:
              summary: Account locked
              value:
                success: false
                error:
                  code: ACCOUNT_LOCKED
                  message: Your account is locked after too many attempts. Please try again in 15 minutes.
                  requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
    TooManyRequests:
      description: Too many requests from this address. The `RateLimit` and `Retry-After` headers say
        when to try again.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            rateLimited:
              summary: Rate limited
              value:
                success: false
                error:
                  code: RATE_LIMITED
                  message: Too many attempts. Please wait a few minutes and try again.
                  requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
      headers:
        RateLimit:
          description: How many requests are left in this window, and when it resets (seconds).
          schema: {type: string}
          example: limit=10, remaining=0, reset=840
        RateLimit-Policy:
          description: The limit and window (seconds).
          schema: {type: string}
          example: 10;w=900
        Retry-After:
          description: Seconds to wait before trying again.
          schema: {type: integer}
          example: 840
    ServiceUnavailable:
      description: The database, photo storage or this feature is not available right now.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            unavailable:
              summary: Not available
              value:
                success: false
                error:
                  code: SERVICE_UNAVAILABLE
                  message: We can't reach the server right now. Please try again in a minute.
                  requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
