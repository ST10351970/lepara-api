  /admin/donations/{id}/void:
    post:
      operationId: donationsVoid
      tags:
      - 'Admin: stock and donations'
      summary: Void a donation recorded by mistake
      description: |-
        Any admin (staff or super admin): `Authorization: Bearer <access token>`.

        Donations are never deleted. Voiding a goods donation takes its quantity back out of stock; if some of the goods were already given out, the reply is 409.
      security:
      - adminBearer: []
      parameters:
      - name: id
        in: path
        description: The donation's ID
        required: true
        schema: {type: integer, minimum: 1}
        example: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, minLength: 3, maxLength: 300}
              required: [reason]
            example: {reason: Recorded twice by mistake}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    properties:
                      donationId: {type: integer}
                      type: {type: string}
                      donorName: {type: string}
                      isAnonymous: {type: boolean}
                      amountCents: {description: Can be null.}
                      amount: {description: Can be null.}
                      receiptReference: {description: Can be null.}
                      stockItem:
                        type: object
                        properties:
                          stockItemId: {type: integer}
                          name: {type: string}
                          unit: {type: string}
                      quantity: {type: integer}
                      initiative: {description: Can be null.}
                      pledge: {description: Can be null.}
                      dateReceived: {type: string, format: date}
                      recordedBy:
                        type: object
                        properties:
                          adminId: {type: integer}
                          fullName: {type: string}
                      voided:
                        type: object
                        properties:
                          at: {type: string, format: date-time}
                          by:
                            type: object
                            properties:
                              adminId: {type: integer}
                              fullName: {type: string}
                          reason: {type: string}
              example:
                success: true
                data:
                  donationId: 2
                  type: Goods
                  donorName: St Mary's Church
                  isAnonymous: false
                  amountCents: null
                  amount: null
                  receiptReference: null
                  stockItem: {stockItemId: 6, name: Fleece blankets, unit: blanket}
                  quantity: 10
                  initiative: null
                  pledge: null
                  dateReceived: '2026-10-16'
                  recordedBy: {adminId: 1, fullName: Lindiwe Dube}
                  voided:
                    at: '2026-10-16T15:14:04.069Z'
                    by: {adminId: 1, fullName: Lindiwe Dube}
                    reason: Recorded twice by mistake
        '400':
          description: 'The request was refused: a field is missing or wrong. `fields` lists one message
            per field, to show under each input (`request` means the request as a whole).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                wrongFields:
                  summary: Wrong or missing fields
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Please check the highlighted fields.
                      fields:
                      - field: reason
                        message: Please say why this donation is being voided, for example "Recorded twice".
                      requestId: 9b2e6c1a-4f3d-4c8e-a1b2-3c4d5e6f7a8b
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
