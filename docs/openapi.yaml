                      accessToken: {type: string}
                      tokenType: {type: string}
                      expiresIn: {type: integer}
                      admin: {type: string}
              example:
                success: true
                data: {accessToken: <access token (JWT)>, tokenType: Bearer, expiresIn: 900, admin: <as
